general {
    lock_cmd = hyprlock          # run hyprlock before sleeping
    before_sleep_cmd = hyprlock  # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn screen back on after wake
}

listener {
    timeout = 300                # 5 minutes — dim screen
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600                # 10 minutes — lock screen
    on-timeout = hyprlock
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900                # 15 minutes — sleep
    on-timeout = systemctl suspend
    on-resume = hyprctl dispatch dpms on
}
